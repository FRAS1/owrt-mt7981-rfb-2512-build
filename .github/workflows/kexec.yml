name: build-kexec-lite
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: Decode C source
        run: echo '' | base64 -d > kexec-lite.c
      - name: Compile static aarch64 binary
        run: |
          aarch64-linux-gnu-gcc -static -Os -s -Wall -o kexec-lite kexec-lite.c
          file kexec-lite
          sha256sum kexec-lite
          test "$(stat -c %s kexec-lite)" -gt 10000
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kexec-lite
          path: kexec-lite
          if-no-files-found: error
